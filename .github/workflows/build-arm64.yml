name: Build whatRust Windows ARM64

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC ARM64 Cross-Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64

      - name: Setup Rust & ARM64 Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Build Native ARM64 Binary
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/Cargo.toml") {
            cargo build --release --target aarch64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
          } else {
            cargo build --release --target aarch64-pc-windows-msvc
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whatRust-ARM64-Windows
          path: |
            target/aarch64-pc-windows-msvc/release/*.exe
            src-tauri/target/aarch64-pc-windows-msvc/release/*.exe
          if-no-files-found: error
